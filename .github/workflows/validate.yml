name: Validate package

on:
  push:
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tooling and runtime dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            desktop-file-utils \
            gnome-keyring \
            gst-libav \
            gst-plugins-base \
            gst-plugins-good \
            gtk4 \
            hicolor-icon-theme \
            libsecret \
            webkitgtk-6.0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify .SRCINFO is current
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE" && makepkg --printsrcinfo > .SRCINFO.generated'
          diff -u .SRCINFO .SRCINFO.generated

      - name: Build package
        run: |
          su builder -c 'cd "$GITHUB_WORKSPACE" && makepkg --cleanbuild --noconfirm'

      - name: Sanity-check package contents
        run: |
          pkg="$(find . -maxdepth 1 -name 'seraphirc-bin-*.pkg.tar.*' -print -quit)"
          test -n "$pkg"
          bsdtar -tf "$pkg" | grep -qx 'usr/bin/seraphirc'
          bsdtar -tf "$pkg" | grep -qx 'usr/share/applications/chat.seraphirc.SeraphIRC.desktop'
          bsdtar -tf "$pkg" | grep -qx 'usr/share/licenses/seraphirc-bin/LICENSE'

name: Inspect upstream package

on:
  push:
    paths:
      - '.github/workflows/inspect-upstream.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download SeraphIRC 6.0.1
        run: |
          curl -fL --retry 3 -o seraphirc.deb             https://github.com/seraphirc/seraphirc-download/releases/download/v6.0.1/seraphirc_6.0.1_amd64.deb
          echo "sha256:"
          sha256sum seraphirc.deb

      - name: Debian control metadata
        run: dpkg-deb --info seraphirc.deb

      - name: Package file tree
        run: dpkg-deb --contents seraphirc.deb

      - name: Extract and inspect ELF dependencies
        run: |
          mkdir pkg
          dpkg-deb --extract seraphirc.deb pkg
          find pkg -type f -exec file {} + | grep ELF || true
          while IFS= read -r f; do
            echo "===== $f ====="
            ldd "$f" || true
          done < <(find pkg -type f -exec file {} + | awk -F: '/ELF/{print $1}')
